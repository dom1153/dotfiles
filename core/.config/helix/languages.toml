### fish
[[language]]
name = "fish"
language-servers = [ "fish-lsp" ]

[language-server.fish-lsp]
command = "fish-lsp"
args= ["start"]
environment = { "fish_lsp_show_client_popups" = "false" }

### just
[[language]]
name = "just"
language-servers = ["just-lsp"]

[language-server.just-lsp]
command = "just-lsp"
args = [""]

### go
[[language]]
name = "gotmpl"
file-types = ["gotmpl", { glob = "dot_config/**/*.tmpl" }]

[[language]]
name = "go"
formatter = { command = "goimports" }

### html emmet
# https://github.com/helix-editor/helix/issues/1896#issuecomment-2679282107
[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

# https://github.com/olrtg/emmet-language-server?tab=readme-ov-file#helix
[[language]]
name = "html"
roots = [".git"]
language-servers = ["vscode-html-language-server", "emmet-lsp"]

### php
### > phpactor status
[language-server.phpactor]
command = "phpactor"
args = ["language-server"]

[[language]]
name = "php"
scope = "source.php"
injection-regex = "php"
file-types = ["php", "inc", "php4", "php5", "phtml", "ctp"]
shebangs = ["php"]
roots = ["composer.json", "index.php"]
comment-token = "//"
language-servers = [ "phpactor" ]
indent = { tab-width = 4, unit = "    " }

### twig (php)
# https://github.com/twigphp/Twig/issues/3650#issuecomment-1757466879
# https://github.com/moetelo/twiggy
[language-server.twiggy-lsp]
command = "twiggy-language-server"
args = ["--stdio"]

[[language]]
name = "twig"
roots = [".git"]
file-types = ["twig"]
language-servers = ["twiggy-lsp", "emmet-lsp"]
