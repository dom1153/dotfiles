# Catppuccin Mocha (green), from https://github.com/catppuccin/lazygit themes-mergable/mocha/green.yml
# Merged on top of core's config.yml (features/lazygit.fish).
gui:
  theme:
    activeBorderColor:
      - '#a6e3a1'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#a6e3a1'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'
# Lists aren't merged, so this replaces core's whole list: keep the two in sync.
# --features picks the delta theme defined in ~/.config/git/catppuccin.gitconfig.
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --features catppuccin-mocha
    - command: difft --color=always  --background={{colorScheme}} --context={{diffContext}}
      type: extDiff
