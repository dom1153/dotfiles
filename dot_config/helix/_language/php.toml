### > phpactor status
[language-server.phpactor]
command = "phpactor"
args = ["language-server"]

# [[language]]
# name = "php"
# language-servers = ["phpactor"]

[[language]]
name = "php"
scope = "source.php"
injection-regex = "php"
file-types = ["php", "inc", "php4", "php5", "phtml", "ctp"]
shebangs = ["php"]
roots = ["composer.json", "index.php"]
comment-token = "//"
language-servers = [ "phpactor" ]
indent = { tab-width = 4, unit = "    " }

