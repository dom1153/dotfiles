## completion = ["ignored"] # creates silly prompt when starting debugger...

# https://github.com/helix-editor/helix/issues/1896#issuecomment-2679282107
[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

# https://github.com/twigphp/Twig/issues/3650#issuecomment-1757466879
# https://github.com/moetelo/twiggy
[language-server.twiggy-lsp]
command = "twiggy-language-server"
args = ["--stdio"]

# https://github.com/olrtg/emmet-language-server?tab=readme-ov-file#helix
[[language]]
name = "html"
roots = [".git"]
language-servers = ["vscode-html-language-server", "emmet-lsp"]

[[language]]
name = "twig"
roots = [".git"]
file-types = ["twig"]
language-servers = ["twiggy-lsp", "emmet-lsp"]
